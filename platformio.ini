; PlatformIO Configuration for Laundry-IQ
; ESP32 + Arduino Framework + FreeRTOS (built-in)

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Serial monitor baud rate — must match Serial.begin() in code
monitor_speed = 115200

; Build flags
build_flags =
    -std=gnu++17          ; Modern C++ features
    -D CORE_DEBUG_LEVEL=3 ; ESP32 debug output level (3 = Info)
